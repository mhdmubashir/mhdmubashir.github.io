<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brand exports — Muhammed Mubashir</title>
<!--
  Source for every social raster: open with a hash to pick a variant and
  screenshot at the matching size (see scripts/build-assets.sh).
    #og        1200 x 630   (Open Graph / Twitter card)
    #github    1280 x 640   (GitHub social preview)
    #linkedin  1584 x 396   (LinkedIn cover)
    #avatar     512 x 512   (profile picture: GitHub, LinkedIn, X)
-->
<style>
  @font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; src: url("../src/assets/fonts/ibm-plex-sans-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; src: url("../src/assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Architects Daughter"; src: url("../src/assets/fonts/architects-daughter-latin-400-normal.woff2") format("woff2"); }

  :root {
    --paper: #f6f4ee; --paper-2: #efece4; --ink: #1d1c1a; --ink-2: #4a4843;
    --graphite: #63605a; --stroke: #b9b5aa; --stroke-2: #d9d5cb; --mark: #b4402e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; overflow: hidden; background: var(--paper); display: none; }
  .frame:target { display: block; }

  /* notebook margin rule */
  .rule { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--stroke-2); }
  .mono { font-family: "IBM Plex Mono", monospace; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--graphite); }
  .hand { font-family: "Architects Daughter", cursive; color: var(--ink-2); }
  .name { font-weight: 500; letter-spacing: -.035em; line-height: 1; margin: 0; }
  .role { font-weight: 500; margin: 0; }
  .tag { color: var(--ink-2); margin: 0; }
  .portrait { position: absolute; padding: 12px; border: 3px solid var(--ink); background: var(--paper-2);
              border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; }
  .portrait img { display: block; border-radius: 3px; filter: grayscale(.15) contrast(1.02); }
  .portrait figcaption { margin-top: 10px; font-size: 20px; color: var(--graphite); }
  .m { position: absolute; }
  .divider { position: absolute; left: 0; right: 0; height: 8px; color: var(--stroke); }
  .divider svg { width: 100%; height: 8px; }

  /* ---------- OG 1200x630 ---------- */
  #og { width: 1200px; height: 630px; }
  #og .rule { left: 96px; }
  #og .text { position: absolute; left: 136px; top: 118px; width: 700px; }
  #og .hello { font-size: 34px; margin-bottom: 26px; display: inline-block; position: relative; }
  #og .name { font-size: 84px; margin-bottom: 26px; }
  #og .role { font-size: 32px; margin-bottom: 18px; }
  #og .tag { font-size: 24px; line-height: 1.45; max-width: 620px; }
  #og .portrait { right: 110px; top: 120px; transform: rotate(1.8deg); }
  #og .portrait img { width: 300px; height: 300px; }
  #og .url { position: absolute; left: 136px; bottom: 52px; }
  #og .m { left: 30px; top: 40px; width: 40px; }
  #og .divider { bottom: 104px; left: 136px; right: 110px; }

  /* ---------- GitHub 1280x640 ---------- */
  #github { width: 1280px; height: 640px; }
  #github .rule { left: 104px; }
  #github .text { position: absolute; left: 146px; top: 124px; width: 740px; }
  #github .hello { font-size: 34px; margin-bottom: 26px; display: inline-block; position: relative; }
  #github .name { font-size: 88px; margin-bottom: 26px; }
  #github .role { font-size: 32px; margin-bottom: 18px; }
  #github .tag { font-size: 24px; line-height: 1.45; max-width: 640px; }
  #github .portrait { right: 120px; top: 128px; transform: rotate(1.8deg); }
  #github .portrait img { width: 300px; height: 300px; }
  #github .url { position: absolute; left: 146px; bottom: 52px; }
  #github .m { left: 32px; top: 44px; width: 40px; }
  #github .divider { bottom: 106px; left: 146px; right: 120px; }

  /* ---------- LinkedIn 1584x396 ---------- */
  #linkedin { width: 1584px; height: 396px; }
  #linkedin .rule { left: 120px; }
  #linkedin .text { position: absolute; left: 160px; top: 86px; width: 900px; }
  #linkedin .hello { font-size: 30px; margin-bottom: 16px; display: inline-block; }
  #linkedin .name { font-size: 76px; margin-bottom: 18px; }
  #linkedin .role { font-size: 28px; margin-bottom: 10px; }
  #linkedin .tag { font-size: 21px; max-width: 760px; }
  #linkedin .portrait { display: none; } /* LinkedIn overlays the avatar bottom-left; keep right side calm */
  #linkedin .url { position: absolute; right: 120px; bottom: 40px; }
  #linkedin .m { right: 120px; top: 56px; width: 120px; opacity: .9; }
  #linkedin .divider { display: none; }

  /* ---------- Avatar 512x512 ---------- */
  #avatar { width: 512px; height: 512px; }
  #avatar .rule, #avatar .text, #avatar .url, #avatar .m, #avatar .divider { display: none; }
  #avatar .portrait { left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-1.5deg); padding: 14px; border-width: 4px; }
  #avatar .portrait img { width: 380px; height: 380px; }
  #avatar .portrait figcaption { display: none; }
</style>
</head>
<body>
<template id="card">
  <div class="rule"></div>
  <svg class="m" viewBox="0 0 64 64" fill="none" stroke="#1d1c1a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 52 L15.5 13 L32 40 L48.5 12.5 L51 52" stroke-width="5"/>
    <path d="M11.5 51.5 L14 14.5 L32 42 L50 14 L52.5 51" stroke-width="1.6" opacity=".35"/>
  </svg>
  <div class="text">
    <div class="hand hello">hello, I'm</div>
    <h1 class="name">Muhammed Mubashir</h1>
    <p class="role">Full Stack Software Developer</p>
    <p class="tag">Building scalable mobile and web applications with performance and precision.</p>
  </div>
  <figure class="portrait" style="margin:0">
    <img src="../src/assets/portrait.jpg" alt="" />
    <figcaption class="hand">fig. 1 — Kerala, India / UAE</figcaption>
  </figure>
  <div class="divider"><svg viewBox="0 0 600 6" preserveAspectRatio="none"><path d="M0 3.4 C 60 2.1, 120 4.6, 200 3.1 S 320 4.4, 420 2.7 S 540 3.9, 600 2.9" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linecap="round"/></svg></div>
  <div class="mono url">mhdmubashir.github.io</div>
</template>

<div class="frame" id="og"></div>
<div class="frame" id="github"></div>
<div class="frame" id="linkedin"></div>
<div class="frame" id="avatar"></div>

<script>
  const tpl = document.getElementById("card");
  for (const f of document.querySelectorAll(".frame")) f.append(tpl.content.cloneNode(true));
</script>
</body>
</html>
